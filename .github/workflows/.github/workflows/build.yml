name: Build CODM ESP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Show repo structure
        run: find . -not -path './.git/*' | sort

      - name: Verify required files
        run: |
          for f in settings.gradle build.gradle gradle.properties \
                   app/build.gradle app/src/main/AndroidManifest.xml; do
            if [ -f "$f" ]; then
              echo "✓ $f"
            else
              echo "✗ MISSING: $f"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Generate signing keystore
        run: |
          KEYSTORE="$RUNNER_TEMP/debug.keystore"

          rm -f "$KEYSTORE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Keystore created:"
          ls -lh "$KEYSTORE"

      - name: Find and sign APK
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: Keystore not found: $KEYSTORE"
            exit 1
          fi

          SIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)

          if [ -z "$SIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "Using signer: $SIGNER"

          UNSIGNED=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            ! -name "*signed*" \
            | head -1)

          if [ -z "$UNSIGNED" ]; then
            echo "ERROR: Release APK was not found."
            find app/build/outputs/apk/release -type f -print
            exit 1
          fi

          echo "APK found: $UNSIGNED"

          OUTPUT="app/build/outputs/apk/release/codm-esp-signed.apk"

          "$SIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT" \
            "$UNSIGNED"

          echo "Signed APK:"
          ls -lh "$OUTPUT"

      - name: Verify APK signature
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)

          "$SIGNER" verify --verbose \
            app/build/outputs/apk/release/codm-esp-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CODM-ESP-APK
          path: app/build/outputs/apk/release/codm-esp-signed.apk
          retention-days: 30
