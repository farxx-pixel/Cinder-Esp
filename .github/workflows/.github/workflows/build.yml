name: Build CODM ESP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find and sign APK
        run: |
          SIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          UNSIGNED=$(find app/build/outputs/apk/release -name "*unsigned*.apk" -o -name "*.apk" | head -1)
          $SIGNER sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/codm-esp-signed.apk \
            $UNSIGNED

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CODM-ESP-APK
          path: app/build/outputs/apk/release/codm-esp-signed.apk
          retention-days: 30
