name: Build CODM ESP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Show repo structure
        run: find . -not -path './.git/*' | sort

      - name: Verify required files
        run: |
          for f in settings.gradle build.gradle gradle.properties \
                   app/build.gradle app/src/main/AndroidManifest.xml; do
            if [ -f "$f" ]; then
              echo "✓ $f"
            else
              echo "✗ MISSING: $f"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

          echo "=== APK files generated by Gradle ==="
          find app/build/outputs -type f -name "*.apk" -print || true

      - name: Generate debug keystore
        run: |
          mkdir -p "$RUNNER_TEMP"

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "=== Keystore generated ==="
          ls -lh "$RUNNER_TEMP/debug.keystore"

      - name: Find and sign APK
        run: |
          set -e

          SIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)

          echo "Using signer: $SIGNER"

          echo "=== Searching for APK ==="

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            ! -name "codm-esp-signed.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was found."
            echo "=== Complete build outputs ==="
            find app/build/outputs -type f -print
            exit 1
          fi

          echo "APK found: $APK"

          "$SIGNER" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/codm-esp-signed.apk \
            "$APK"

          echo "=== APK successfully signed ==="
          ls -lh app/build/outputs/apk/release/codm-esp-signed.apk

      - name: Verify APK signature
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -1)

          "$SIGNER" verify --verbose \
            app/build/outputs/apk/release/codm-esp-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CODM-ESP-APK
          path: app/build/outputs/apk/release/codm-esp-signed.apk
          retention-days: 30
